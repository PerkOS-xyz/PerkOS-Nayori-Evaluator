name: promote exact main commit to qa

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact reviewed commit from main
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qa-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify reviewed main commit
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          test "$(printf '%s' "$RELEASE_SHA" | wc -c)" -eq 40
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin main qa
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git merge-base --is-ancestor origin/qa "$RELEASE_SHA"
      - name: Run release gate
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          git checkout --detach "$RELEASE_SHA"
          npm ci
          npm run verify
          npm audit --audit-level=high
      - name: Promote without force
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: git push origin "$RELEASE_SHA:refs/heads/qa"
